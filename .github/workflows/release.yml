name: Publish packages to npmjs registry

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r --sort run build

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install ggshield
        run: pipx install ggshield

      - name: Publish every package whose version is not on npm yet, in dependency order
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          pnpm -r --sort --workspace-concurrency=1 exec -- sh -c '
            name=$(jq -r .name package.json); version=$(jq -r .version package.json)
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on npm)"; exit 0
            fi
            npm publish --access public'
